name: ubuntu-build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deb:
        description: 'Build the Debian packages'
        type: boolean
        default: false
# paths:
# - "*"
# - "!README.md" <-- don't rebuild on doc change
concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ubuntu-build (${{ matrix.gz }})
    strategy:
      fail-fast: false
      matrix:
        gz: [harmonic, jetty]
    env:
      GZ_VERSION: ${{ matrix.gz }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Gazebo
        uses: gazebo-tooling/setup-gazebo@v0.3.0
        with:
          required-gazebo-distributions: ${{ matrix.gz }}

      - name: Install Build Dependencies
        shell: bash
        run: |
          sudo apt update && sudo apt install --no-install-recommends -y \
          software-properties-common \
          make \
          cmake \
          ccache \
          g++ \
          git
          sudo apt update && sudo apt install --no-install-recommends -y \
          cppzmq-dev \
          rapidjson-dev \
          libopencv-dev \
          libunwind-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          gstreamer1.0-gl

      # Put ccache into github cache for faster build
      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> "$GITHUB_OUTPUT"

      - name: Cache ccache files
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ${{github.workflow}}-${{ matrix.gz }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{github.workflow}}-${{ matrix.gz }}-ccache-  # restore ccache from either previous build on this branch or on master

      - name: Setup ccache
        run: |
          . .github/workflows/ccache.env

      - name: Build
        shell: bash
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j4

      - name: Check SDF files
        run: |
          scripts/check_sdf.sh

      - name: Build Debian package
        if: inputs.deb
        working-directory: build
        run: |
          cpack -G DEB -R "0.0.0+git$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          sudo apt-get install -y ./*.deb

      - name: Upload Debian package
        if: inputs.deb
        uses: actions/upload-artifact@v7
        with:
          name: ardupilot-gazebo-${{ matrix.gz }}-deb
          path: build/*.deb
          if-no-files-found: error
