name: ubuntu-build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deb:
        description: 'Build the Debian packages'
        type: boolean
        default: false
# paths:
# - "*"
# - "!README.md" <-- don't rebuild on doc change
concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ubuntu-build (${{ matrix.gz }})
    strategy:
      fail-fast: false
      matrix:
        gz: [harmonic, jetty]
    env:
      GZ_VERSION: ${{ matrix.gz }}
      # Debian packages on manual request and on every push to main
      BUILD_DEB: ${{ inputs.deb || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Gazebo
        uses: gazebo-tooling/setup-gazebo@v0.3.0
        with:
          required-gazebo-distributions: ${{ matrix.gz }}

      - name: Install Build Dependencies
        shell: bash
        run: |
          sudo apt update && sudo apt install --no-install-recommends -y \
          software-properties-common \
          make \
          cmake \
          ccache \
          g++ \
          git
          sudo apt update && sudo apt install --no-install-recommends -y \
          cppzmq-dev \
          rapidjson-dev \
          libopencv-dev \
          libunwind-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          gstreamer1.0-gl

      # Put ccache into github cache for faster build
      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> "$GITHUB_OUTPUT"

      - name: Cache ccache files
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ${{github.workflow}}-${{ matrix.gz }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{github.workflow}}-${{ matrix.gz }}-ccache-  # restore ccache from either previous build on this branch or on master

      - name: Setup ccache
        run: |
          . .github/workflows/ccache.env

      - name: Build
        shell: bash
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j4

      - name: Check SDF files
        run: |
          scripts/check_sdf.sh

      # the commit date keeps the version increasing along main
      - name: Build Debian package
        if: env.BUILD_DEB == 'true'
        working-directory: build
        run: |
          cpack -G DEB -R "0.0.0+git$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S).$(git rev-parse --short HEAD)"
          sudo apt-get install -y ./*.deb

      - name: Upload Debian package
        if: env.BUILD_DEB == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ardupilot-gazebo-${{ matrix.gz }}-deb
          path: build/*.deb
          if-no-files-found: error

  # Replace the nightly prerelease with the packages built from main
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ArduPilot/ardupilot_gazebo'
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v8
        with:
          pattern: ardupilot-gazebo-*-deb
          merge-multiple: true
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly ./*.deb --prerelease --target "${GITHUB_SHA}" \
            --title "Nightly" \
            --notes "Debian packages built from ${GITHUB_SHA} on main, for Ubuntu 24.04."
